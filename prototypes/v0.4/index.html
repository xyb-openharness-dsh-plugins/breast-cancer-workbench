<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小粉宝 PinkyPal · 全病程工作台原型 v0.4.0</title>
<link rel="icon" type="image/png" sizes="96x96" href="assets/brand/pinkypal-mark-96.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="primer.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="prototype-bar"><span><b>交互原型 v0.4.0</b> · 全部为模拟资料</span><span>仅本页演示 · 刷新重置 · 未接入 DSH / AI</span></div>
<div class="workspace">
  <aside class="sidebar" aria-label="小粉宝业务导航">
    <div class="brand"><img id="brand-mark" src="assets/brand/pinkypal-mark-96.png" srcset="assets/brand/pinkypal-mark-192.png 2x" width="48" height="48" alt="小粉宝 PinkyPal 品牌标识：粉色小机器人抱着橙色爱心"><div><strong>小粉宝</strong><span>PinkyPal · 陪你慢慢来</span></div></div>
    <button class="profile profile-btn" data-action="profiles" aria-label="切换演示档案，当前为林女士">
      <div class="avatar" id="profile-avatar" aria-hidden="true">林</div>
      <div><b id="profile-name">林女士的资料</b><span id="profile-meta">模拟档案 · 本人视角</span></div>
      <span class="profile-caret" aria-hidden="true">⌄</span>
    </button>
    <nav id="nav"></nav>
    <div class="sidebar-bottom"><span class="eyebrow">小 X 宝家族</span><p>记录可以少一点，<br>陪伴可以久一点。</p><button class="text-button" data-action="help">原型操作说明 ↗</button></div>
  </aside>
  <div class="work-area">
    <header class="topbar">
      <div class="breadcrumb">小粉宝工作台 <span>/</span> <b id="breadcrumb">看板</b></div>
      <div class="top-actions">
        <button class="status" id="ready-store" data-action="open-store" aria-label="资料目录：已激活"><i></i><span>资料目录</span><b>已激活</b></button>
        <button class="status" id="ready-session" data-action="start-session" aria-label="对话：未进入激活"><i class="grey"></i><span>对话</span><b>未进入激活</b></button>
        <button data-action="settings" aria-label="打开设置：工作区目录、文档解析、临床数据库">设置</button>
        <button id="font-toggle" aria-pressed="false" title="切换大字">大字 Aa</button>
        <!-- 36 号 §3.2：顶栏「?」是疾病概要的固定入口，primer.js 会接管它并补 aria；
             看板首卡另有一个文字按钮（§2.6 出口按钮排），两处都带 data-primer-open。 -->
        <button class="icon-button primer-entry" data-primer-open aria-label="疾病概要：乳腺癌是什么？定义、医学资料与指南情况、治疗全景、发展趋势" title="疾病概要：定义 · 指南 · 治疗全景 · 趋势">?</button>
        <button class="ver-chip" id="ver-chip" data-action="about" aria-label="关于小粉宝：查看版本号与构建信息">v0.4.0</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer">小粉宝 · 与患者和照护者一起整理、理解、准备沟通 <span class="ver-line"><b id="app-version">v0.4.0</b><em id="app-build">2026-10-27</em></span></footer>
  </div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head"><div><span class="eyebrow" id="dialog-eyebrow">小粉宝</span><h2 id="dialog-title"></h2></div><button class="icon-button" data-action="close" aria-label="关闭弹窗">×</button></div>
  <div id="dialog-body" class="dialog-body"></div>
  <div id="dialog-foot" class="dialog-foot"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="primer-data.js"></script>
<script src="primer.js"></script>
<script src="app.js"></script>
</body></html>
