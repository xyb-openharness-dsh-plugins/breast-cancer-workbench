<!doctype html>
<!-- 接口基址与运行形态由服务端在返回页面时替换，写在 html 的 data 属性里。
     不用内联 script：本站 CSP 的 script-src 'self' 禁内联（实测在 DSH 面板里
     内联 boot 被静默拦掉，基址变 undefined，接口全部 404）。
     独立启动是 /api + standalone；挂在 DSH 面板里是 /api/breast-cancer-workbench + host。 -->
<html lang="zh-CN" data-api-base="{{WB_API_BASE}}" data-runtime="{{WB_RUNTIME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小粉宝 PinkyPal · 全病程工作台 v0.13.7</title>
<meta name="description" content="小粉宝：本机优先的乳腺癌病程整理与就诊准备工作台。数据只存在你选择的资料目录里。">
<link rel="icon" type="image/png" sizes="96x96" href="assets/brand/pinkypal-mark-96.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<!-- 36 号疾病概要：样式只定义结构，颜色走本项目令牌 -->
<link rel="stylesheet" href="primer.css">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="prototype-bar"><span id="runtime-line"><b>开发版 v0.13.7</b> · 本机数据 · 未接入 DSH 宿主</span><span>记录不是诊断 · 处置由治疗团队判断</span></div>
<div class="workspace">
  <aside class="sidebar" aria-label="小粉宝业务导航">
    <div class="brand"><img id="brand-mark" src="assets/brand/pinkypal-mark-96.png" srcset="assets/brand/pinkypal-mark-192.png 2x" width="48" height="48" alt="小粉宝 PinkyPal 品牌标识：粉色小机器人抱着橙色爱心"><div><strong>小粉宝</strong><span>PinkyPal · 陪你慢慢来</span></div></div>
    <button class="profile profile-btn" id="profile-btn" data-action="profile" aria-label="切换档案">
      <div class="avatar" id="profile-avatar" aria-hidden="true">我</div>
      <div><b id="profile-name">我的资料</b><span id="profile-meta">本机档案</span></div>
      <span class="profile-caret" aria-hidden="true">⌄</span>
    </button>
    <button class="profile-add" data-action="new-subject" aria-label="新建档案">＋ 新建档案</button>
    <nav id="nav" aria-label="一级模块"></nav>
    <div id="subnav-dock" aria-label="二级模块"></div>
    <div class="sidebar-bottom"><span class="eyebrow">小 X 宝家族</span><p>记录可以少一点，<br>陪伴可以久一点。</p><button class="text-button" data-action="help">这版能做什么 ↗</button></div>
  </aside>
  <div class="work-area">
    <header class="topbar">
      <div class="breadcrumb">小粉宝工作台 <span>/</span> <b id="breadcrumb">看板</b></div>
      <div class="top-actions">
        <button class="status" id="ready-store" data-action="settings"><i class="grey"></i><span>资料目录</span><b>未设置</b></button>
        <button class="status" id="ready-session" data-action="session"><i class="grey"></i><span>对话</span><b>未进入激活</b></button>
        <button data-action="settings" aria-label="打开设置：资料目录、文档解析">设置</button>
        <button id="font-toggle" aria-pressed="false" title="切换大字">大字 Aa</button>
        <!-- 36 号：「?」由 primer.js 接管（补 aria-label / aria-haspopup），位置固定在版本 chip 左侧 -->
        <button class="dp-trigger-inline" data-primer-open aria-label="疾病概要：乳腺癌是什么？定义、医学资料与指南情况、治疗全景、发展趋势">?</button>
        <button class="ver-chip" id="ver-chip" data-action="about" aria-label="关于小粉宝：查看版本号与构建信息">v0.13.7</button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer">小粉宝 · 与患者和照护者一起整理、理解、准备沟通 <span class="ver-line"><b id="app-version">v0.13.7</b><em id="app-build">2026-10-27</em></span></footer>
  </div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head"><div><span class="eyebrow" id="dialog-eyebrow">小粉宝</span><h2 id="dialog-title"></h2></div><button class="icon-button" data-action="close" aria-label="关闭弹窗">×</button></div>
  <div id="dialog-body" class="dialog-body"></div>
  <div id="dialog-foot" class="dialog-foot"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<!-- 接口基址与运行形态由服务端在返回页面时替换：
     独立启动是 /api + standalone；挂在 DSH 面板里是 /api/breast-cancer-workbench + host。
     前端因此不用判断自己跑在哪，也不会把前缀写死在几十处调用里。
     占位用 {{ }} 而不是 __ __：后者会和变量名里的下划线连成一片，被一起替换掉。 -->
<!-- 36 号疾病概要：数据先于模块加载；模块是经典脚本（不是 ESM），
     因为它在 CSP script-src 'self' 下要能被直接 <script src>，且要早于业务模块挂载按钮。 -->
<script src="primer-data.js"></script>
<script src="primer.js"></script>
<script type="module" src="app.js"></script>
</body></html>
