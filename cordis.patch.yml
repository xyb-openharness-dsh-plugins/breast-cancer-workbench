# 把服务端入口插进 Harness 的插件树（workbench-standard §3.3）。
#
# 两条硬规则：
# 1. name 必须写 npm 包名，写相对路径或绝对路径 Node 解析不到；
# 2. 空文件或纯注释文件会导致启动失败——有条目就照下面写，没有条目时写 `[]`。
#
# id 与 root 的取值在 lib/identity.js，由 scripts/check-package.mjs 比对，别手改这里。
- insert:
    - id: breast-cancer-workbench
      name: '@pinkypal-dsh/breast-cancer-workbench'
      config:
        root: !!js dshHomePath('pinkypal-workbench')
